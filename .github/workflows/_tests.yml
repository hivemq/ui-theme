on:
  workflow_call:

jobs:
  run_linter:
    name: 🧪 Lint files
    runs-on: ubuntu-latest
    steps:
      - name: 👓 Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup

      - name: 📝 Execute linter
        run: pnpm lint:all

  build:
    name: 👷 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup

      - run: pnpm build

      - name: 🔺 Upload frontend distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build_distribution
          path: theme/dist
          if-no-files-found: error
          retention-days: 1

  build_playground:
    needs: build
    name: 🛝 Build Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: 🔻 Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_distribution
          path: theme/dist

      - uses: ./.github/actions/setup

      - run: pnpm build:testing

      - name: 🔺 Upload Page artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: testing/dist

  unit_tests:
    needs: build
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: 🔻 Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_distribution
          path: theme/dist

      - uses: ./.github/actions/setup
        with:
          run_install: true

      - name: 🧪 start unit tests
        run: pnpm test:unit

  visual_tests:
    needs: build
    name: 🎨 Visual Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: 🔻 Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_distribution
          path: theme/dist

      - uses: ./.github/actions/setup
        with:
          run_install: true

      - name: 🧪 start server and run tests
        run: |
          pnpm dev &
          sleep 30

          echo "Server started"
          sleep 1

          echo "Install Chromium Browser"
          pnpx playwright@1.42.1 install chromium

          echo "Oli told me sleep 😴"
          sleep 1

          echo "Run visual tests"
          pnpm --filter './testing' safetest:ci

      - name: ⬆️ Upload Difference Images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-screenshots
          path: ./testing/artifacts/image_diffs
          if-no-files-found: ignore
          retention-days: 2
